name: Contributor Mural
description: Generate a mural of contributor avatars (SVG or PNG) from contributors, sponsors, stargazers, org members, or your own list
author: hahwul

branding:
  icon: award
  color: yellow

inputs:
  config:
    description: Path to the config YAML, relative to the repository root
    required: false
    default: .github/contributor-mural.yml
  token:
    description: >-
      Token for the GitHub API. Required for the sponsors source; also raises
      rate limits and grants access to private repositories for the
      contributors, members, and stargazers sources.
    required: false
    default: ${{ github.token }}
  no_commit:
    description: Generate the files but skip commit/push (must be true or false)
    required: false
    default: "false"
  commit_message:
    description: Commit message for the generated files
    required: false
    default: "chore: update contributor mural"

outputs:
  paths:
    description: Comma-separated paths of the generated files (SVG and PNG)
  svg_path:
    description: Deprecated alias for `paths`, kept for existing workflows
  user_count:
    description: Number of users rendered in the last output
  width:
    description: >-
      Pixel width of the first generated file, for embedding with explicit
      dimensions. PNG outputs report their rasterized size.
  height:
    description: Pixel height of the first generated file
  changed:
    description: Whether the files changed and were committed (false when no_commit is set)

runs:
  using: docker
  # Prebuilt so consumers start in seconds instead of building Crystal on
  # their runner.
  #
  # This floating tag is what `@main` tracks. Released refs do not use it: the
  # release workflow rewrites this line to the version's own immutable tag and
  # moves `vX.Y.Z` and `vX` onto that commit, so a pinned action ref always
  # determines the image — see .github/workflows/release.yml.
  image: docker://ghcr.io/crystal-actions/contributor-mural:v1
