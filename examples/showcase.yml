outputs:
  - path: examples/grid.svg
    style: grid
  - path: examples/honeycomb.svg
    style: honeycomb
  - path: examples/mosaic.svg
    style: mosaic
  - path: examples/spiral.svg
    style: spiral
  - path: examples/orbit.svg
    style: orbit
  - path: examples/voronoi.svg
    style: voronoi
  - path: examples/stencil.svg
    style: stencil
  - path: examples/constellation.svg
    style: constellation
  - path: examples/skyline.svg
    style: skyline
  - path: examples/metro.svg
    style: metro

grid:
  columns: 6
  avatar_size: 64
  shape: circle
  show_names: true

honeycomb:
  columns: 6
  cell_size: 72
  gap: 4

mosaic:
  width: 480
  base_cell: 56
  tiers: [3, 2, 1]
  gap: 3

spiral:
  max_size: 76
  min_size: 34

orbit:
  center_size: 96
  avatar_size: 54

voronoi:
  width: 480
  cell_size: 120
  gap: 4

stencil:
  text: THANKS
  pixel_size: 14
  gap: 2

constellation:
  width: 480
  max_size: 72
  min_size: 28

skyline:
  width: 520
  avatar_size: 48

metro:
  columns: 4
  station_size: 52
