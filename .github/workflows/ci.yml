name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - name: Install rasterizer
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends librsvg2-bin
      - name: Install dependencies
        run: shards install
      - name: Check formatting
        run: crystal tool format --check
      # A malformed workflow fails the run before any job starts, which is
      # hard to read in the UI; catch it here instead.
      - name: Check workflow and action YAML
        run: |
          crystal eval 'require "yaml"
            failed = false
            Dir.glob(".github/workflows/*.yml", ".github/*.yml", "action.yml").each do |file|
              begin
                YAML.parse(File.read(file))
              rescue ex
                failed = true
                puts "#{file}: #{ex.message}"
              end
            end
            exit 1 if failed'
      - name: Lint
        run: |
          if [ ! -x bin/ameba ]; then
            mkdir -p bin
            crystal build lib/ameba/bin/ameba.cr -o bin/ameba --release
          fi
          bin/ameba src spec
      - name: Run specs
        run: crystal spec --order=random

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t contributor-mural:ci .
      - name: Smoke test
        run: |
          mkdir -p /tmp/ws
          printf 'users:\n  - login: hahwul\n  - login: octocat\noutputs:\n  - path: wall.svg\n  - path: wall.png\n' > /tmp/ws/config.yml
          docker run --rm -w /ws -v /tmp/ws:/ws \
            -e INPUT_CONFIG=config.yml -e INPUT_NO_COMMIT=true -e GITHUB_WORKSPACE=/ws \
            contributor-mural:ci
          grep -q "data:image" /tmp/ws/wall.svg
          head -c 4 /tmp/ws/wall.png | grep -q PNG

  # Exercises the public entry point (action.yml) the way a consumer does;
  # the docker job above bypasses it by running the image directly.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # action.yml ships a published image so consumers do not build one.
      # Left as-is, this job would test that image instead of the code under
      # review, so point it back at the Dockerfile first.
      - name: Build the action from this checkout
        run: |
          sed -i 's|image: docker://.*|image: Dockerfile|' action.yml
          grep -q 'image: Dockerfile' action.yml
      - name: Prepare a workspace config
        run: |
          mkdir -p .github
          printf 'users:\n  - login: hahwul\n  - login: octocat\noutput: ci-wall.svg\n' \
            > .github/contributor-mural.yml
      - name: Run the action
        id: mural
        uses: ./
        with:
          no_commit: "true"
      - name: Check outputs
        run: |
          test "${{ steps.mural.outputs.paths }}" = "ci-wall.svg"
          test "${{ steps.mural.outputs.user_count }}" = "2"
          test "${{ steps.mural.outputs.changed }}" = "false"
          grep -q "data:image" ci-wall.svg
          # That the dimensions reach a consumer as whole numbers at all;
          # spec/runner_spec.cr pins what they are relative to the file.
          echo "${{ steps.mural.outputs.width }}" | grep -Eq '^[1-9][0-9]*$'
          echo "${{ steps.mural.outputs.height }}" | grep -Eq '^[1-9][0-9]*$'
