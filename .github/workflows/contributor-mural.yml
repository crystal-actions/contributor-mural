name: Contributor Mural

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: write

concurrency:
  group: contributor-mural

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Uses the published image, like any consumer on @v1 — this run doubles
      # as a check that the released action still works. CI covers HEAD.
      - name: Generate contributor mural
        uses: ./
